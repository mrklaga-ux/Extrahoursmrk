<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrahoursmrk</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 12px;
      margin: 0;
    }
    h1 { color: #00e676; text-align: center; font-size: 1.6rem; margin: 12px 0; }
    .card {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    label { display: block; margin: 10px 0 4px; color: #b0b0b0; font-size: 0.9rem; font-weight: 500; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
      cursor: pointer;
      background: #252525;
      padding: 10px;
      border-radius: 8px;
    }
    .checkbox-container input {
      width: auto;
      margin: 0;
      transform: scale(1.4);
      accent-color: #00e676;
    }
    button.btn-open {
      background: #00e676;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 16px;
      border: none;
      margin-bottom: 14px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
    }
    button.btn-save { background: #00e676; color: #000; font-weight: bold; border: none; font-size: 1.1rem; margin-top: 10px; }
    button.btn-delete { background: #d32f2f; color: #fff; font-weight: bold; border: none; font-size: 1.1rem; margin-top: 6px; display: none; }
    button.btn-cancel { background: #444; color: #fff; border: none; margin-top: 6px; }
    button.btn-sec { background: #2c2c2c; color: #fff; border: 1px solid #555; margin-top: 8px; font-weight: 600; }
    
    .val-box { background: #252525; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 10px; border: 1px solid #383838; }
    .val { font-size: 1.6rem; font-weight: bold; color: #00e676; margin-top: 4px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { padding: 12px 8px; border-bottom: 1px solid #333; text-align: left; }
    th { color: #aaa; font-weight: 600; }
    
    tr.clickable-row {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    tr.clickable-row:active, tr.clickable-row:hover {
      background-color: #2c2c2c;
    }

    .warn-badge {
      background: #ff9800;
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
    }
    .holiday-badge {
      background: #e91e63;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
    }
    #formCard { display: none; }
  </style>
</head>
<body>

  <h1>Extrahoursmrk</h1>

  <button class="btn-open" onclick="openForm()">➕ Νέα Καταχώρηση Βάρδιας</button>

  <div class="card" id="formCard">
    <h3 id="formTitle" style="margin-top:0; color:#00e676;">Καταχώρηση Βάρδιας</h3>
    
    <input type="hidden" id="editIndex" value="-1">

    <label>Ημερομηνία</label>
    <input type="date" id="workDate">

    <label>Ώρα Έναρξης</label>
    <input type="time" id="startTime" value="08:00">

    <label>Ώρα Λήξης</label>
    <input type="time" id="endTime" value="16:00">

    <label>Διάλειμμα (λεπτά)</label>
    <select id="breakMins">
      <option value="0">0 λεπτά</option>
      <option value="15">15 λεπτά</option>
      <option value="30">30 λεπτά</option>
      <option value="45">45 λεπτά</option>
      <option value="60">60 λεπτά</option>
    </select>

    <label class="checkbox-container">
      <input type="checkbox" id="isHoliday">
      <span>🎉 Είναι Αργία / Ειδική Ημέρα (18€/ώρα)</span>
    </label>

    <button class="btn-save" onclick="saveEntry()">💾 Αποθήκευση</button>
    <button class="btn-delete" id="deleteBtn" onclick="deleteCurrentEntry()">🗑️ Διαγραφή Βάρδιας</button>
    <button class="btn-cancel" onclick="closeForm()">Ακύρωση</button>
  </div>

  <div class="card">
    <div class="val-box">
      <label>Σύνολο Έξτρα Ωρών (Υπερωρίες + Έλλειμμα Ανάπαυσης)</label>
      <div class="val" id="totalHours">0.00 hrs</div>
    </div>
    <div class="val-box">
      <label>Συνολική Εκτιμώμενη Αμοιβή</label>
      <div class="val" id="totalPay">€0.00</div>
    </div>
  </div>

  <div class="card">
    <label>Επιλογή Περιόδου Εξαγωγής Excel</label>
    <select id="exportMode" onchange="toggleExportMode()">
      <option value="month">Συγκεκριμένος Μήνας</option>
      <option value="all">Όλο το Ιστορικό (Όλοι οι Μήνες)</option>
    </select>

    <div id="monthSelectorDiv">
      <label>Μήνας Αναφοράς</label>
      <input type="month" id="exportMonth">
    </div>

    <button class="btn-sec" onclick="exportCSV()">📊 Εξαγωγή σε Excel (CSV)</button>
    <button class="btn-sec" onclick="sendHR()">✉️ Αποστολή στο HR</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Ιστορικό Βαρδιών <span style="font-size:0.75rem; color:#aaa; font-weight:normal;">(Πατήστε μια γραμμή για διόρθωση/διαγραφή)</span></h3>
    <table>
      <thead>
        <tr>
          <th>Ημερ. & Ώρες</th>
          <th>Έξτρα</th>
          <th>Ποσό</th>
        </tr>
      </thead>
      <tbody id="logsTable"></tbody>
    </table>
  </div>

<script>
  const todayStr = new Date().toISOString().substring(0, 10);
  document.getElementById('workDate').value = todayStr;
  document.getElementById('exportMonth').value = todayStr.substring(0, 7);

  // ΦΟΡΤΩΣΗ ΑΠΟ LOCALSTORAGE Ή ΑΠΟ ΤΑ ΕΝΣΩΜΑΤΩΜΕΝΑ ΔΕΔΟΜΕΝΑ ΑΣΦΑΛΕΙΑΣ
  let defaultShifts = [
    { date: "2026-09-01", startISO: "2026-09-01T08:00:00.000Z", endISO: "2026-09-01T16:00:00.000Z", breakMins: 0, isHoliday: false },
    { date: "2026-09-02", startISO: "2026-09-02T08:00:00.000Z", endISO: "2026-09-02T16:00:00.000Z", breakMins: 0, isHoliday: false },
    { date: "2026-09-03", startISO: "2026-09-03T08:00:00.000Z", endISO: "2026-09-03T16:00:00.000Z", breakMins: 0, isHoliday: false },
    { date: "2026-09-04", startISO: "2026-09-04T08:00:00.000Z", endISO: "2026-09-04T16:00:00.000Z", breakMins: 0, isHoliday: false },
    { date: "2026-09-07", startISO: "2026-09-07T08:00:00.000Z", endISO: "2026-09-07T16:00:00.000Z", breakMins: 0, isHoliday: false },
    { date: "2026-09-08", startISO: "2026-09-08T08:00:00.000Z", endISO: "2026-09-08T16:00:00.000Z", breakMins: 0, isHoliday: false }
  ];

  let stored = localStorage.getItem('extrahours_safe_v1');
  let shifts = stored ? JSON.parse(stored) : defaultShifts;

  function toggleExportMode() {
    const mode = document.getElementById('exportMode').value;
    document.getElementById('monthSelectorDiv').style.display = (mode === 'month') ? 'block' : 'none';
  }

  function openForm(index = -1) {
    document.getElementById('editIndex').value = index;
    const deleteBtn = document.getElementById('deleteBtn');

    if (index === -1) {
      document.getElementById('formTitle').innerText = 'Καταχώρηση Βάρδιας';
      document.getElementById('workDate').value = new Date().toISOString().substring(0, 10);
      document.getElementById('startTime').value = '08:00';
      document.getElementById('endTime').value = '16:00';
      document.getElementById('breakMins').value = '0';
      document.getElementById('isHoliday').checked = false;
      deleteBtn.style.display = 'none';
    } else {
      let item = shifts[index];
      document.getElementById('formTitle').innerText = 'Επεξεργασία / Διαγραφή Βάρδιας';
      document.getElementById('workDate').value = item.date;
      let sDate = new Date(item.startISO);
      document.getElementById('startTime').value = sDate.toTimeString().substring(0, 5);
      if (item.endISO) {
        let eDate = new Date(item.endISO);
        document.getElementById('endTime').value = eDate.toTimeString().substring(0, 5);
      }
      document.getElementById('breakMins').value = item.breakMins || 0;
      document.getElementById('isHoliday').checked = !!item.isHoliday;
      deleteBtn.style.display = 'block';
    }
    document.getElementById('formCard').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeForm() { document.getElementById('formCard').style.display = 'none'; }

  function saveAndRender() {
    shifts.sort((a, b) => new Date(a.startISO) - new Date(b.startISO));
    localStorage.setItem('extrahours_safe_v1', JSON.stringify(shifts));
    
    const tbody = document.getElementById('logsTable');
    tbody.innerHTML = '';
    let grandTotalExtraHours = 0;
    let grandTotalPay = 0;

    shifts.forEach((item, index) => {
      let start = new Date(item.startISO);
      let startTimeStr = start.toTimeString().substring(0, 5);
      let endTimeStr = item.endISO ? new Date(item.endISO).toTimeString().substring(0, 5) : 'Ανοιχτή';

      let end = item.endISO ? new Date(item.endISO) : null;
      if (!end) {
        tbody.innerHTML += `
          <tr class="clickable-row" onclick="openForm(${index})">
            <td><b>${item.date}</b><br><span style="color:#aaa; font-size:0.8rem;">🕒 ${startTimeStr} - ${endTimeStr}</span></td>
            <td>-</td>
            <td>-</td>
          </tr>`;
        return;
      }

      let diffMins = (end - start) / (1000 * 60) - (item.breakMins || 0);
      let totalHours = diffMins > 0 ? diffMins / 60 : 0;
      let otHours = totalHours > 8 ? (totalHours - 8) : 0;

      let restHoursVal = 24.00;
      let restDeficit = 0;
      let restWarning = '';

      if (index > 0 && shifts[index - 1].endISO) {
        let prevEnd = new Date(shifts[index - 1].endISO);
        let restMins = (start - prevEnd) / (1000 * 60);
        restHoursVal = restMins / 60;

        if (restHoursVal < 11 && restHoursVal >= 0) {
          restDeficit = 11 - restHoursVal;
          restWarning = `<br><span class="warn-badge">⚠️ Ανάπαυση ${restHoursVal.toFixed(2)}h (&lt;11h)</span>`;
        }
      }

      let dayOfWeek = start.getDay();
      let isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
      let is18Rate = isWeekend || item.isHoliday;

      let rate = is18Rate ? 18.00 : 9.00;
      let rowExtraHours = otHours + restDeficit;
      let rowPay = rowExtraHours * rate;

      grandTotalExtraHours += rowExtraHours;
      grandTotalPay += rowPay;

      let badge = '';
      if (item.isHoliday) {
        badge = '<br><span class="holiday-badge">🎉 Αργία (18€)</span>';
      } else if (isWeekend) {
        badge = '<br><span class="holiday-badge">📅 Σ/Κ (18€)</span>';
      }

      tbody.innerHTML += `
        <tr class="clickable-row" onclick="openForm(${index})">
          <td><b>${item.date}</b>${badge}<br><span style="color:#aaa; font-size:0.8rem;">🕒 ${startTimeStr} - ${endTimeStr}</span>${restWarning}</td>
          <td>${rowExtraHours.toFixed(2)}h</td>
          <td>€${rowPay.toFixed(2)} <span style="font-size:0.7rem; color:#888;">(${rate}€/h)</span></td>
        </tr>`;
    });

    document.getElementById('totalHours').innerText = grandTotalExtraHours.toFixed(2) + ' hrs';
    document.getElementById('totalPay').innerText = '€' + grandTotalPay.toFixed(2);
  }

  function saveEntry() {
    const editIndex = parseInt(document.getElementById('editIndex').value);
    const date = document.getElementById('workDate').value;
    const start = document.getElementById('startTime').value;
    const end = document.getElementById('endTime').value;
    const breakMins = parseInt(document.getElementById('breakMins').value);
    const isHoliday = document.getElementById('isHoliday').checked;

    if(!date || !start || !end) return alert('Συμπλήρωσε όλα τα πεδία');

    let startISO = new Date(`${date}T${start}`).toISOString();

    let [sH, sM] = start.split(':').map(Number);
    let [eH, eM] = end.split(':').map(Number);

    let d1 = new Date(2000, 0, 1, sH, sM);
    let d2 = new Date(2000, 0, 1, eH, eM);
    if (d2 <= d1) d2.setDate(d2.getDate() + 1);

    let endISO = new Date(new Date(startISO).getTime() + (d2 - d1)).toISOString();

    if (editIndex === -1) {
      shifts.push({ date, startISO, endISO, breakMins, isHoliday });
    } else {
      shifts[editIndex] = { date, startISO, endISO, breakMins, isHoliday };
    }

    saveAndRender();
    closeForm();
  }

  function deleteCurrentEntry() {
    const editIndex = parseInt(document.getElementById('editIndex').value);
    if (editIndex >= 0) {
      if (confirm('Σίγουρα θέλεις να διαγράψεις αυτή τη βάρδια;')) {
        shifts.splice(editIndex, 1);
        saveAndRender();
        closeForm();
      }
    }
  }

  function exportCSV() {
    if(shifts.length === 0) return alert('Δεν υπάρχουν δεδομένα!');
    
    const mode = document.getElementById('exportMode').value;
    const selectedMonth = document.getElementById('exportMonth').value;

    let monthNames = ["Ιανουάριος", "Φεβρουάριος", "Μάρτιος", "Απρίλιος", "Μάιος", "Ιούνιος", "Ιούλιος", "Αύγουστος", "Σεπτέμβριος", "Οκτώβριος", "Νοέμβριος", "Δεκέμβριος"];
    let periodTitle = "Όλο το Ιστορικό (Όλα τα Έτη)";
    if (mode === 'month' && selectedMonth) {
      let parts = selectedMonth.split('-');
      let y = parts[0];
      let m = parseInt(parts[1], 10) - 1;
      periodTitle = `${monthNames[m]} ${y}`;
    }

    let csv = `\uFEFF"ΠΕΡΙΟΔΟΣ ΑΝΑΦΟΡΑΣ:";"${periodTitle}"\n`;
    csv += 'Ημερομηνία;Έναρξη;Λήξη;Συνολικές Ώρες Βάρδιας;Ώρες Ανάπαυσης από Προηγούμενη;Υπερωρία (>8h);Έλλειψη Ανάπαυσης (<11h);Συνολικές Έξτρα Ώρες;Ωρομίσθιο (€);Συνολικό Ποσό (€)\n';
    let count = 0;

    shifts.forEach((item, index) => {
      if (mode === 'month' && !item.date.startsWith(selectedMonth)) {
        return; 
      }

      let start = new Date(item.startISO);
      let startTimeStr = start.toTimeString().substring(0, 5);
      let endTimeStr = item.endISO ? new Date(item.endISO).toTimeString().substring(0, 5) : '';
      let end = item.endISO ? new Date(item.endISO) : null;
      
      let totalHours = 0;
      let restHoursVal = 24.00;
      let otHours = 0;
      let restDeficit = 0;
      let rowExtraHours = 0;
      let rate = 9.00;
      let rowPay = 0;

      if (end) {
        let diffMins = (end - start) / (1000 * 60) - (item.breakMins || 0);
        totalHours = diffMins > 0 ? diffMins / 60 : 0;
        otHours = totalHours > 8 ? (totalHours - 8) : 0;

        if (index > 0 && shifts[index - 1].endISO) {
          let prevEnd = new Date(shifts[index - 1].endISO);
          let restMins = (start - prevEnd) / (1000 * 60);
          restHoursVal = restMins / 60;
          if (restHoursVal < 11 && restHoursVal >= 0) {
            restDeficit = 11 - restHoursVal;
          }
        }

        let dayOfWeek = start.getDay();
        let isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
        rate = (isWeekend || item.isHoliday) ? 18.00 : 9.00;
        
        rowExtraHours = otHours + restDeficit;
        rowPay = rowExtraHours * rate;
      }

      csv += `"${item.date}";"${startTimeStr}";"${endTimeStr}";"${totalHours.toFixed(2)}";"${restHoursVal.toFixed(2)}";"${otHours.toFixed(2)}";"${restDeficit.toFixed(2)}";"${rowExtraHours.toFixed(2)}";"${rate.toFixed(2)}";"${rowPay.toFixed(2)}"\n`;
      count++;
    });

    if (count === 0) {
      return alert('Δεν υπάρχουν δεδομένα για την επιλεγμένη περίοδο!');
    }

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `ExtraHours_${mode === 'month' ? selectedMonth : 'Full_History'}_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  function sendHR() {
    if(shifts.length === 0) return alert('Δεν υπάρχουν δεδομένα!');
    let totalH = document.getElementById('totalHours').innerText;
    let totalP = document.getElementById('totalPay').innerText;
    let body = `Καλησπέρα,\n\nΣας αποστέλλω τις έξτρα ώρες εργασίας μου:\nΣύνολο Έξτρα Ωρών: ${totalH}\nΣύνολο Αμοιβής: ${totalP}\n\nΕυχαριστώ.`;
    window.location.href = `mailto:hr@company.com?subject=Έξτρα Ώρες&body=${encodeURIComponent(body)}`;
  }

  saveAndRender();
</script>
</body>
</html>
