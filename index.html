<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrahoursmrk</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 12px;
      margin: 0;
    }
    h1 { color: #00e676; text-align: center; font-size: 1.6rem; margin: 12px 0; }
    .card {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    label { display: block; margin: 10px 0 4px; color: #b0b0b0; font-size: 0.9rem; font-weight: 500; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button.btn-open {
      background: #00e676;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 16px;
      border: none;
      margin-bottom: 14px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
    }
    button.btn-save { background: #00e676; color: #000; font-weight: bold; border: none; font-size: 1.1rem; margin-top: 10px; }
    button.btn-delete { background: #d32f2f; color: #fff; font-weight: bold; border: none; font-size: 1.1rem; margin-top: 6px; display: none; }
    button.btn-cancel { background: #444; color: #fff; border: none; margin-top: 6px; }
    button.btn-sec { background: #2c2c2c; color: #fff; border: 1px solid #555; margin-top: 8px; font-weight: 600; }
    button.btn-sheets { background: #107c41; color: #fff; border: none; margin-top: 8px; font-weight: 600; }
    button.btn-backup { background: #1976d2; color: #fff; border: none; margin-top: 8px; font-weight: 600; }
    button.btn-restore { background: #f57c00; color: #fff; border: none; margin-top: 8px; font-weight: 600; }
    button.btn-toggle-settings { background: #333; color: #ccc; border: 1px solid #555; font-size: 0.9rem; padding: 10px; margin-bottom: 14px; }
    
    .val-box { background: #252525; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 10px; border: 1px solid #383838; }
    .val { font-size: 1.6rem; font-weight: bold; color: #00e676; margin-top: 4px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { padding: 12px 8px; border-bottom: 1px solid #333; text-align: left; }
    th { color: #aaa; font-weight: 600; }
    
    tr.clickable-row {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    tr.clickable-row:active, tr.clickable-row:hover {
      background-color: #2c2c2c;
    }
    #formCard, #settingsCard { display: none; }
  </style>
</head>
<body>

  <h1>Extrahoursmrk</h1>

  <button class="btn-open" onclick="openForm()">➕ Νέα Καταχώρηση Βάρδιας</button>

  <button class="btn-toggle-settings" onclick="toggleSettings()">⚙️ Ρυθμίσεις & Ασφάλεια Δεδομένων (Backup)</button>

  <div class="card" id="settingsCard" style="border-color: #1976d2;">
    <h3 style="margin-top:0; color:#1976d2; font-size: 1.1rem;">Διαχείριση Backup & Επαναφοράς</h3>
    <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 10px;">Εδώ μπορείτε να αποθηκεύσετε ή να επαναφέρετε τα δεδομένα σας με ασφάλεια.</p>
    <button class="btn-backup" onclick="exportBackupJSON()">📤 Εξαγωγή Backup (Αποθήκευση)</button>
    <button class="btn-restore" onclick="triggerRestoreJSON()">📥 Εισαγωγή Backup (Επαναφορά)</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackupJSON(event)">
  </div>

  <div class="card" id="formCard">
    <h3 id="formTitle" style="margin-top:0; color:#00e676;">Καταχώρηση Βάρδιας</h3>
    
    <input type="hidden" id="editIndex" value="-1">

    <label>Ημερομηνία</label>
    <input type="date" id="workDate" onchange="calculateAmounts()">

    <label>Ώρα Έναρξης</label>
    <input type="time" id="startTime" value="12:00">

    <label>Ώρα Λήξης</label>
    <input type="time" id="endTime" value="20:00">

    <label>Συνολικές Ώρες Βάρδιας</label>
    <input type="number" step="0.25" id="totalShiftHours" value="8.00">

    <label>Ώρες Ανάπαυσης</label>
    <input type="number" step="0.25" id="restHours" value="0.00" oninput="calculateAmounts()">

    <label>Κανονικές Ώρες</label>
    <input type="number" step="0.25" id="normalHours" value="0.00">

    <label>Υπερωρίες</label>
    <input type="number" step="0.25" id="overtimeHours" value="0.00">

    <label>Σύνολο Υπερωριών</label>
    <input type="number" step="0.25" id="totalOvertime" value="0.00" oninput="calculateAmounts()">

    <label>Διάφορα (Ωρομίσθιο: 9€ / Σαβ/κο: 18€)</label>
    <input type="number" step="0.25" id="miscHours" value="9.00">

    <label>Τελικό Ποσό / Σύνολο (€)</label>
    <input type="number" step="0.01" id="finalAmount" value="0.00">

    <button class="btn-save" onclick="saveEntry()">💾 Αποθήκευση</button>
    <button class="btn-delete" id="deleteBtn" onclick="deleteCurrentEntry()">🗑️ Διαγραφή Βάρδιας</button>
    <button class="btn-cancel" onclick="closeForm()">Ακύρωση</button>
  </div>

  <div class="card">
    <div class="val-box">
      <label>Σύνολο Υπερωριών Μήνα</label>
      <div class="val" id="totalHoursVal">0.00 hrs</div>
    </div>
    <div class="val-box">
      <label>Συνολικό Τελικό Ποσό Μήνα</label>
      <div class="val" id="totalPayVal">€0.00</div>
    </div>
  </div>

  <div class="card">
    <label>Μήνας Αναφοράς</label>
    <input type="month" id="exportMonth" value="2026-09">

    <button class="btn-sec" onclick="exportCSV()">📊 Εξαγωγή σε Καθαρό Excel (CSV με Σύνολα)</button>
    <button class="btn-sheets" onclick="syncGoogleSheets()">🟢 Οδηγίες για Google Sheets</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Ιστορικό Σεπτεμβρίου 2026 <span style="font-size:0.75rem; color:#aaa; font-weight:normal;">(Πατήστε μια γραμμή για διόρθωση)</span></h3>
    <table>
      <thead>
        <tr>
          <th>Ημερομηνία</th>
          <th>Ώρες</th>
          <th>Τελικό Ποσό</th>
        </tr>
      </thead>
      <tbody id="logsTable"></tbody>
    </table>
  </div>

<script>
  let defaultShifts = [
    {date: "2026-09-01", start: "09:15", end: "20:30", totalShift: 11.25, rest: 24.00, normal: 3.25, overtime: 0.00, totalOT: 3.25, misc: 9.00, finalAmt: 29.25},
    {date: "2026-09-02", start: "09:30", end: "01:30", totalShift: 16.00, rest: 13.00, normal: 8.00, overtime: 0.00, totalOT: 8.00, misc: 9.00, finalAmt: 72.00},
    {date: "2026-09-03", start: "09:30", end: "00:30", totalShift: 15.00, rest: 8.00, normal: 7.00, overtime: 3.00, totalOT: 10.00, misc: 9.00, finalAmt: 90.00},
    {date: "2026-09-04", start: "09:30", end: "01:30", totalShift: 16.00, rest: 9.00, normal: 8.00, overtime: 2.00, totalOT: 10.00, misc: 9.00, finalAmt: 90.00},
    {date: "2026-09-14", start: "10:00", end: "18:00", totalShift: 8.00, rest: 224.50, normal: 0.00, overtime: 0.00, totalOT: 0.00, misc: 9.00, finalAmt: 0.00},
    {date: "2026-09-15", start: "10:00", end: "18:00", totalShift: 8.00, rest: 16.00, normal: 0.00, overtime: 0.00, totalOT: 0.00, misc: 9.00, finalAmt: 0.00},
    {date: "2026-09-16", start: "09:00", end: "18:30", totalShift: 9.50, rest: 15.00, normal: 1.50, overtime: 0.00, totalOT: 1.50, misc: 9.00, finalAmt: 13.50},
    {date: "2026-09-17", start: "09:00", end: "01:00", totalShift: 16.00, rest: 14.50, normal: 8.00, overtime: 0.00, totalOT: 8.00, misc: 9.00, finalAmt: 72.00},
    {date: "2026-09-18", start: "08:00", end: "18:00", totalShift: 10.00, rest: 7.00, normal: 2.00, overtime: 4.00, totalOT: 6.00, misc: 9.00, finalAmt: 54.00},
    {date: "2026-09-21", start: "09:00", end: "18:30", totalShift: 9.50, rest: 63.00, normal: 1.50, overtime: 0.00, totalOT: 1.50, misc: 9.00, finalAmt: 13.50},
    {date: "2026-09-22", start: "09:00", end: "23:30", totalShift: 14.50, rest: 14.50, normal: 6.50, overtime: 0.00, totalOT: 6.50, misc: 9.00, finalAmt: 58.50},
    {date: "2026-09-23", start: "09:30", end: "00:30", totalShift: 15.00, rest: 10.00, normal: 7.00, overtime: 1.00, totalOT: 8.00, misc: 9.00, finalAmt: 72.00},
    {date: "2026-09-24", start: "09:00", end: "00:00", totalShift: 15.00, rest: 8.50, normal: 7.00, overtime: 2.50, totalOT: 9.50, misc: 9.00, finalAmt: 85.50},
    {date: "2026-09-25", start: "10:00", end: "23:45", totalShift: 13.75, rest: 10.00, normal: 5.75, overtime: 1.00, totalOT: 6.75, misc: 9.00, finalAmt: 60.75},
    {date: "2026-09-26", start: "13:00", end: "00:00", totalShift: 24.00, rest: 0.00, normal: 0.00, overtime: 0.00, totalOT: 0.00, misc: 9.00, finalAmt: 0.00}
  ];

  let stored = localStorage.getItem('extrahours_exact_data_v3');
  let shifts = stored ? JSON.parse(stored) : defaultShifts;
  if (!stored) {
    localStorage.setItem('extrahours_exact_data_v3', JSON.stringify(shifts));
  }

  function isWeekend(dateStr) {
    if (!dateStr) return false;
    let d = new Date(dateStr);
    let day = d.getDay();
    return (day === 0 || day === 6); // 0 = Κυριακή, 6 = Σάββατο
  }

  function calculateAmounts() {
    let dateStr = document.getElementById('workDate').value;
    let totalOT = parseFloat(document.getElementById('totalOvertime').value) || 0;
    let rate = isWeekend(dateStr) ? 18.0 : 9.0;
    
    document.getElementById('miscHours').value = rate.toFixed(2);
    document.getElementById('finalAmount').value = (totalOT * rate).toFixed(2);
  }

  function toggleSettings() {
    const card = document.getElementById('settingsCard');
    card.style.display = card.style.display === 'block' ? 'none' : 'block';
  }

  function openForm(index = -1) {
    document.getElementById('editIndex').value = index;
    const deleteBtn = document.getElementById('deleteBtn');
    if (index === -1) {
      document.getElementById('formTitle').innerText = 'Νέα Καταχώρηση Βάρδιας';
      let todayStr = new Date().toISOString().substring(0, 10);
      document.getElementById('workDate').value = todayStr;
      document.getElementById('startTime').value = '12:00';
      document.getElementById('endTime').value = '20:00';
      document.getElementById('totalShiftHours').value = '8.00';
      document.getElementById('restHours').value = '0.00';
      document.getElementById('normalHours').value = '0.00';
      document.getElementById('overtimeHours').value = '0.00';
      document.getElementById('totalOvertime').value = '0.00';
      deleteBtn.style.display = 'none';
    } else {
      document.getElementById('formTitle').innerText = 'Επεξεργασία Βάρδιας';
      let item = shifts[index];
      document.getElementById('workDate').value = item.date;
      document.getElementById('startTime').value = item.start;
      document.getElementById('endTime').value = item.end;
      document.getElementById('totalShiftHours').value = item.totalShift;
      document.getElementById('restHours').value = item.rest;
      document.getElementById('normalHours').value = item.normal;
      document.getElementById('overtimeHours').value = item.overtime;
      document.getElementById('totalOvertime').value = item.totalOT;
      document.getElementById('miscHours').value = item.misc;
      document.getElementById('finalAmount').value = item.finalAmt;
      deleteBtn.style.display = 'block';
    }
    calculateAmounts();
    document.getElementById('formCard').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeForm() { document.getElementById('formCard').style.display = 'none'; }

  function saveAndRender() {
    shifts.sort((a, b) => new Date(a.date) - new Date(b.date));
    localStorage.setItem('extrahours_exact_data_v3', JSON.stringify(shifts));
    
    const tbody = document.getElementById('logsTable');
    tbody.innerHTML = '';
    let totalOTSum = 0;
    let totalPaySum = 0;

    shifts.forEach((item, index) => {
      totalOTSum += Number(item.totalOT);
      totalPaySum += Number(item.finalAmt);

      tbody.innerHTML += `
        <tr class="clickable-row" onclick="openForm(${index})">
          <td><b>${item.date}</b><br><span style="color:#aaa; font-size:0.8rem;">🕒 ${item.start} - ${item.end}</span></td>
          <td>Σύνολο Υπερ.: <b>${Number(item.totalOT).toFixed(2)}h</b></td>
          <td><b>€${Number(item.finalAmt).toFixed(2)}</b></td>
        </tr>`;
    });

    document.getElementById('totalHoursVal').innerText = totalOTSum.toFixed(2) + ' hrs';
    document.getElementById('totalPayVal').innerText = '€' + totalPaySum.toFixed(2);
  }

  function saveEntry() {
    const editIndex = parseInt(document.getElementById('editIndex').value);
    const entry = {
      date: document.getElementById('workDate').value,
      start: document.getElementById('startTime').value,
      end: document.getElementById('endTime').value,
      totalShift: parseFloat(document.getElementById('totalShiftHours').value) || 0,
      rest: parseFloat(document.getElementById('restHours').value) || 0,
      normal: parseFloat(document.getElementById('normalHours').value) || 0,
      overtime: parseFloat(document.getElementById('overtimeHours').value) || 0,
      totalOT: parseFloat(document.getElementById('totalOvertime').value) || 0,
      misc: parseFloat(document.getElementById('miscHours').value) || 9.0,
      finalAmt: parseFloat(document.getElementById('finalAmount').value) || 0
    };

    if(!entry.date) return alert('Συμπλήρωσε ημερομηνία!');

    if (editIndex === -1) {
      shifts.push(entry);
    } else {
      shifts[editIndex] = entry;
    }

    saveAndRender();
    closeForm();
  }

  function deleteCurrentEntry() {
    const editIndex = parseInt(document.getElementById('editIndex').value);
    if (editIndex >= 0) {
      if (confirm('Σίγουρα θέλεις να διαγράψεις αυτή τη βάρδια?')) {
        shifts.splice(editIndex, 1);
        saveAndRender();
        closeForm();
      }
    }
  }

  function exportCSV() {
    if(shifts.length === 0) return alert('Δεν υπάρχουν δεδομένα!');

    let csv = '\uFEFFΠΕΡΙΟΔΟΣ ΑΝΑΦΟΡΑΣ: Σεπτέμβριος 2026\n';
    csv += 'Ημερομηνία;Έναρξη;Λήξη;Συνολικές Ώρες Βάρδιας;Ώρες Ανάπαυσης;Κανονικές Ώρες;Υπερωρίες;Σύνολο Υπερωριών;Ωρομίσθιο (€);Τελικό Ποσό/Σύνολο\n';

    let totalOTSum = 0;
    let totalPaySum = 0;

    shifts.forEach(item => {
      totalOTSum += Number(item.totalOT);
      totalPaySum += Number(item.finalAmt);

      csv += `${item.date};${item.start};${item.end};${item.totalShift.toFixed(2)};${item.rest.toFixed(2)};${item.normal.toFixed(2)};${item.overtime.toFixed(2)};${item.totalOT.toFixed(2)};${Number(item.misc).toFixed(2)};${item.finalAmt.toFixed(2)}\n`;
    });

    csv += `\n; ; ; ; ; ; ;ΣΥΝΟΛΟ ΥΠΕΡΩΡΙΩΝ:;${totalOTSum.toFixed(2)}; \n`;
    csv += `; ; ; ; ; ; ;ΤΕΛΙΚΟ ΠΟΣΟ ΜΗΝΑ:; ;${totalPaySum.toFixed(2)}\n`;

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `ExtraHours_2026-09_Final.csv`;
    link.click();
  }

  function syncGoogleSheets() {
    alert("Για Google Sheets:\n1. Κάνε εξαγωγή CSV.\n2. Άνοιξε το Google Drive, δημιούργησε νέο Google Sheet.\n3. Πήγαινε Αρχείο -> Εισαγωγή και ανέβασε το αρχείο CSV. Θα ανοίξει τέλεια με τις στήλες και τα σύνολα κάτω!");
  }

  function exportBackupJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(shifts, null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "extrahours_backup.json");
    dlAnchorElem.click();
  }

  function triggerRestoreJSON() {
    document.getElementById('importFile').click();
  }

  function importBackupJSON(event) {
    const fileReader = new FileReader();
    if (event.target.files[0]) {
      fileReader.readAsText(event.target.files[0], "UTF-8");
      fileReader.onload = function (e) {
        try {
          let parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed)) {
            shifts = parsed;
            saveAndRender();
            alert("Το backup επαναφέρθηκε με επιτυχία!");
          } else {
            alert("Το αρχείο δεν είναι έγκυρο.");
          }
        } catch (err) {
          alert("Σφάλμα ανάγνωσης αρχείου.");
        }
      };
    }
  }

  saveAndRender();
</script>
</body>
</html>
