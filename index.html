<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrahoursmrk</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 12px;
      margin: 0;
    }
    h1 { color: #00e676; text-align: center; font-size: 1.5rem; margin: 10px 0; }
    .card {
      background: #1e1e1e;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      border: 1px solid #333;
    }
    label { display: block; margin: 8px 0 4px; color: #aaa; font-size: 0.9rem; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      cursor: pointer;
    }
    .checkbox-container input {
      width: auto;
      margin: 0;
      transform: scale(1.4);
    }
    button.btn-open {
      background: #00e676;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 14px;
      border: none;
      margin-bottom: 14px;
    }
    button.btn-save { background: #00e676; color: #000; font-weight: bold; border: none; font-size: 1.1rem; margin-top: 8px; }
    button.btn-cancel { background: #444; color: #fff; border: none; margin-top: 4px; }
    button.btn-sec { background: #333; color: #fff; margin-top: 6px; }
    .val-box { background: #252525; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 8px; }
    .val { font-size: 1.5rem; font-weight: bold; color: #00e676; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
    th, td { padding: 12px 8px; border-bottom: 1px solid #333; text-align: left; }
    th { color: #aaa; }
    tr.clickable-row { cursor: pointer; }
    tr.clickable-row:active { background-color: #2a2a2a; }
    .warn-badge {
      background: #ff9800;
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
    }
    .holiday-badge {
      background: #e91e63;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
    }
    #formCard { display: none; }
  </style>
</head>
<body>

  <h1>Extrahoursmrk</h1>

  <button class="btn-open" onclick="openForm()">➕ Νέα Καταχώρηση</button>

  <div class="card" id="formCard">
    <h3 style="margin-top:0; color:#00e676;">Καταχώρηση Βάρδιας</h3>
    
    <label>Ημερομηνία</label>
    <input type="date" id="workDate">

    <label>Ώρα Έναρξης</label>
    <input type="time" id="startTime" value="08:00">

    <label>Ώρα Λήξης</label>
    <input type="time" id="endTime" value="16:00">

    <label>Διάλειμμα (λεπτά)</label>
    <select id="breakMins">
      <option value="0">0 λεπτά</option>
      <option value="15">15 λεπτά</option>
      <option value="30">30 λεπτά</option>
      <option value="45">45 λεπτά</option>
      <option value="60">60 λεπτά</option>
    </select>

    <label class="checkbox-container">
      <input type="checkbox" id="isHoliday">
      <span>🎉 Είναι Αργία (18€/ώρα)</span>
    </label>

    <button class="btn-save" onclick="addEntry()">💾 Αποθήκευση</button>
    <button class="btn-cancel" onclick="closeForm()">Ακύρωση</button>
  </div>

  <div class="card">
    <div class="val-box">
      <label>Σύνολο Έξτρα Ωρών (Υπερωρίες + Έλλειμμα)</label>
      <div class="val" id="totalHours">0.00 hrs</div>
    </div>
    <div class="val-box">
      <label>Συνολική Αμοιβή</label>
      <div class="val" id="totalPay">€0.00</div>
    </div>
  </div>

  <div class="card">
    <button class="btn-sec" onclick="exportCSV()">📊 Εξαγωγή σε Excel (CSV)</button>
    <button class="btn-sec" onclick="sendHR()">✉️ Αποστολή στο HR</button>
    <button class="btn-sec" style="background:#2e7d32; color:#fff;" onclick="loadExcelForce()">🔄 Επαναφορά Δεδομένων Excel</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Ιστορικό Βαρδιών <span style="font-size:0.75rem; color:#aaa; font-weight:normal;">(Πατήστε πάνω για διαγραφή)</span></h3>
    <table>
      <thead>
        <tr>
          <th>Ημερ.</th>
          <th>Έξτρα Ώρες</th>
          <th>Ποσό</th>
        </tr>
      </thead>
      <tbody id="logsTable"></tbody>
    </table>
  </div>

<script>
  document.getElementById('workDate').value = new Date().toISOString().substring(0, 10);

  // Δεδομένα από την εικόνα του Excel
  const excelDefaultShifts = [
    { date: "2026-09-01", startISO: "2026-09-01T09:15:00", endISO: "2026-09-01T20:30:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-02", startISO: "2026-09-02T09:30:00", endISO: "2026-09-03T01:30:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-03", startISO: "2026-09-03T09:30:00", endISO: "2026-09-04T00:30:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-04", startISO: "2026-09-04T09:30:00", endISO: "2026-09-05T01:30:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-14", startISO: "2026-09-14T10:00:00", endISO: "2026-09-14T18:00:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-15", startISO: "2026-09-15T10:00:00", endISO: "2026-09-15T18:00:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-16", startISO: "2026-09-16T09:00:00", endISO: "2026-09-16T18:30:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-17", startISO: "2026-09-17T09:00:00", endISO: "2026-09-18T01:00:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-18", startISO: "2026-09-18T08:00:00", endISO: "2026-09-18T18:00:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-21", startISO: "2026-09-21T09:00:00", endISO: "2026-09-21T18:30:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-22", startISO: "2026-09-22T09:00:00", endISO: "2026-09-22T23:30:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-23", startISO: "2026-09-23T09:30:00", endISO: "2026-09-24T00:30:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-24", startISO: "2026-09-24T09:00:00", endISO: "2026-09-25T00:00:00", breakMins: 0, isHoliday: false },
    { date: "2026-09-25", startISO: "2026-09-25T10:00:00", endISO: "2026-09-25T23:45:00", breakMins: 0, isHoliday: false }
  ];

  let stored = localStorage.getItem('extrahours_v7');
  let shifts = stored ? JSON.parse(stored) : [...excelDefaultShifts];

  function openForm() { document.getElementById('formCard').style.display = 'block'; }
  function closeForm() { document.getElementById('formCard').style.display = 'none'; }

  function saveAndRender() {
    shifts.sort((a, b) => new Date(a.startISO) - new Date(b.startISO));
    localStorage.setItem('extrahours_v7', JSON.stringify(shifts));
    
    const tbody = document.getElementById('logsTable');
    tbody.innerHTML = '';
    let grandTotalExtraHours = 0;
    let grandTotalPay = 0;

    shifts.forEach((item, index) => {
      let start = new Date(item.startISO);
      let end = item.endISO ? new Date(item.endISO) : null;

      if (!end) return; // Αν δεν υπάρχει λήξη ακόμα (π.χ. Σάββατο 26/09), προσπερνάμε τον υπολογισμό

      let diffMins = (end - start) / (1000 * 60) - (item.breakMins || 0);
      let totalHours = diffMins > 0 ? diffMins / 60 : 0;

      // 1. Υπερωρίες (> 8 ώρες)
      let otHours = totalHours > 8 ? (totalHours - 8) : 0;

      // 2. Έλλειμμα Ανάπαυσης (< 11 ώρες)
      let restDeficit = 0;
      let restWarning = '';

      if (index > 0 && shifts[index - 1].endISO) {
        let prevEnd = new Date(shifts[index - 1].endISO);
        let restMins = (start - prevEnd) / (1000 * 60);
        let restHours = restMins / 60;

        if (restHours < 11 && restHours >= 0) {
          restDeficit = 11 - restHours;
          restWarning = `<br><span class="warn-badge">⚠️ Ανάπαυση ${restHours.toFixed(2)}h (&lt;11h)</span>`;
        }
      }

      // Έλεγχος αν η μέρα είναι Σαββατοκύριακο (0 = Κυριακή, 6 = Σάββατο)
      let dayOfWeek = start.getDay();
      let isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
      let is18Rate = isWeekend || item.isHoliday;

      let rate = is18Rate ? 18.00 : 9.00;
      let rowExtraHours = otHours + restDeficit;
      let rowPay = rowExtraHours * rate;

      grandTotalExtraHours += rowExtraHours;
      grandTotalPay += rowPay;

      let badge = '';
      if (item.isHoliday) {
        badge = '<br><span class="holiday-badge">🎉 Αργία (18€)</span>';
      } else if (isWeekend) {
        badge = '<br><span class="holiday-badge">📅 Σ/Κ (18€)</span>';
      }

      tbody.innerHTML += `
        <tr class="clickable-row" onclick="onRowClick(${index})">
          <td>${item.date}${badge}${restWarning}</td>
          <td>${rowExtraHours.toFixed(2)}h</td>
          <td>€${rowPay.toFixed(2)} <span style="font-size:0.7rem; color:#888;">(${rate}€/h)</span></td>
        </tr>`;
    });

    document.getElementById('totalHours').innerText = grandTotalExtraHours.toFixed(2) + ' hrs';
    document.getElementById('totalPay').innerText = '€' + grandTotalPay.toFixed(2);
  }

  function onRowClick(index) {
    let item = shifts[index];
    let confirmDel = confirm(`Θέλετε να διαγράψετε τη βάρδια στις ${item.date};`);
    if (confirmDel) {
      shifts.splice(index, 1);
      saveAndRender();
    }
  }

  function addEntry() {
    const date = document.getElementById('workDate').value;
    const start = document.getElementById('startTime').value;
    const end = document.getElementById('endTime').value;
    const breakMins = parseInt(document.getElementById('breakMins').value);
    const isHoliday = document.getElementById('isHoliday').checked;

    if(!date || !start || !end) return alert('Συμπλήρωσε όλα τα πεδία');

    let startISO = new Date(`${date}T${start}`).toISOString();
    if (shifts.some(e => e.startISO === startISO)) return alert('Η βάρδια υπάρχει ήδη!');

    let [sH, sM] = start.split(':').map(Number);
    let [eH, eM] = end.split(':').map(Number);

    let d1 = new Date(2000, 0, 1, sH, sM);
    let d2 = new Date(2000, 0, 1, eH, eM);
    if (d2 <= d1) d2.setDate(d2.getDate() + 1);

    let endISO = new Date(new Date(startISO).getTime() + (d2 - d1)).toISOString();

    shifts.push({ date, startISO, endISO, breakMins, isHoliday });
    saveAndRender();
    closeForm();

    document.getElementById('isHoliday').checked = false;
  }

  function loadExcelForce() {
    shifts = [...excelDefaultShifts];
    saveAndRender();
  }

  function exportCSV() {
    if(shifts.length === 0) return alert('Δεν υπάρχουν δεδομένα!');
    let csv = 'Ημερομηνία,Έξτρα Ώρες,Αμοιβή (€)\n';
    shifts.forEach(e => {
      csv += `${e.date}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `ExtraHours_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  function sendHR() {
    if(shifts.length === 0) return alert('Δεν υπάρχουν δεδομένα!');
    let totalH = document.getElementById('totalHours').innerText;
    let totalP = document.getElementById('totalPay').innerText;
    let body = `Καλησπέρα,\n\nΣας αποστέλλω τις έξτρα ώρες εργασίας μου:\nΣύνολο Έξτρα Ωρών: ${totalH}\nΣύνολο Αμοιβής: ${totalP}\n\nΕυχαριστώ.`;
    window.location.href = `mailto:hr@company.com?subject=Έξτρα Ώρες&body=${encodeURIComponent(body)}`;
  }

  saveAndRender();
</script>
</body>
</html>
