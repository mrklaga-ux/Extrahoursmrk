<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrahoursmrk</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 12px;
      margin: 0;
    }
    h1 { color: #00e676; text-align: center; font-size: 1.5rem; margin: 10px 0; }
    .card {
      background: #1e1e1e;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      border: 1px solid #333;
    }
    label { display: block; margin: 8px 0 4px; color: #aaa; font-size: 0.9rem; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button.btn-open {
      background: #00e676;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 14px;
      border: none;
      margin-bottom: 14px;
    }
    button.btn-save { background: #00e676; color: #000; font-weight: bold; border: none; font-size: 1.1rem; margin-top: 8px; }
    button.btn-cancel { background: #444; color: #fff; border: none; margin-top: 4px; }
    button.btn-sec { background: #333; color: #fff; margin-top: 6px; }
    .val-box { background: #252525; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 8px; }
    .val { font-size: 1.5rem; font-weight: bold; color: #00e676; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
    th, td { padding: 8px; border-bottom: 1px solid #333; text-align: left; }
    th { color: #aaa; }
    .btn-del { background: #ff5252; color: white; border: none; padding: 4px 10px; border-radius: 4px; width: auto; margin: 0; }
    .warn-badge {
      background: #ff9800;
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 4px;
    }
    #formCard { display: none; }
  </style>
</head>
<body>

  <h1>Extrahoursmrk</h1>

  <!-- ΚΟΥΜΠΙ ΑΝΟΙΓΜΑΤΟΣ ΜΕΝΟΥ -->
  <button class="btn-open" onclick="openForm()">➕ Νέα Καταχώρηση</button>

  <!-- ΦΟΡΜΑ -->
  <div class="card" id="formCard">
    <h3 style="margin-top:0; color:#00e676;">Καταχώρηση Βάρδιας</h3>
    
    <label>Ημερομηνία</label>
    <input type="date" id="workDate">

    <label>Ώρα Έναρξης</label>
    <input type="time" id="startTime" value="08:00">

    <label>Ώρα Λήξης</label>
    <input type="time" id="endTime" value="16:00">

    <label>Διάλειμμα (λεπτά)</label>
    <select id="breakMins">
      <option value="0">0 λεπτά</option>
      <option value="15">15 λεπτά</option>
      <option value="30">30 λεπτά</option>
      <option value="45">45 λεπτά</option>
      <option value="60">60 λεπτά</option>
    </select>

    <button class="btn-save" onclick="addEntry()">💾 Αποθήκευση</button>
    <button class="btn-cancel" onclick="closeForm()">Ακύρωση</button>
  </div>

  <!-- ΣΥΝΟΛΑ -->
  <div class="card">
    <div class="val-box">
      <label>Συνολικές Ώρες</label>
      <div class="val" id="totalHours">0.00 hrs</div>
    </div>
    <div class="val-box">
      <label>Συνολική Αμοιβή (€9/ώρα + 20% υπερωρία)</label>
      <div class="val" id="totalPay">€0.00</div>
    </div>
  </div>

  <!-- ΕΞΑΓΩΓΗ & ΚΑΘΑΡΙΣΜΟΣ -->
  <div class="card">
    <button class="btn-sec" onclick="exportCSV()">📊 Εξαγωγή σε Excel (CSV)</button>
    <button class="btn-sec" onclick="sendHR()">✉️ Αποστολή στο HR</button>
    <button class="btn-sec" style="background:#b71c1c; color:#fff;" onclick="resetExcelData()">🔄 Επαναφορά Δεδομένων Excel</button>
  </div>

  <!-- ΙΣΤΟΡΙΚΟ -->
  <div class="card">
    <h3 style="margin-top:0;">Ιστορικό Βαρδιών</h3>
    <table>
      <thead>
        <tr>
          <th>Ημερ.</th>
          <th>Ώρες</th>
          <th>Ποσό</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="logsTable"></tbody>
    </table>
  </div>

<script>
  document.getElementById('workDate').value = new Date().toISOString().substring(0, 10);

  // Τα δεδομένα από το Excel
  const excelDefaultData = [
    { date: "2026-09-01", startISO: "2026-09-01T09:15:00", endISO: "2026-09-01T20:30:00", netHours: 11.25, pay: 107.10 },
    { date: "2026-09-02", startISO: "2026-09-02T09:30:00", endISO: "2026-09-03T01:30:00", netHours: 16.00, pay: 158.40 },
    { date: "2026-09-03", startISO: "2026-09-03T09:30:00", endISO: "2026-09-04T00:30:00", netHours: 15.00, pay: 147.60 },
    { date: "2026-09-04", startISO: "2026-09-04T09:30:00", endISO: "2026-09-05T01:30:00", netHours: 16.00, pay: 158.40 },
    { date: "2026-09-14", startISO: "2026-09-14T10:00:00", endISO: "2026-09-14T18:00:00", netHours: 8.00, pay: 72.00 },
    { date: "2026-09-15", startISO: "2026-09-15T10:00:00", endISO: "2026-09-15T18:00:00", netHours: 8.00, pay: 72.00 },
    { date: "2026-09-16", startISO: "2026-09-16T09:00:00", endISO: "2026-09-16T18:30:00", netHours: 9.50, pay: 88.20 },
    { date: "2026-09-17", startISO: "2026-09-17T09:00:00", endISO: "2026-09-18T01:00:00", netHours: 16.00, pay: 158.40 },
    { date: "2026-09-18", startISO: "2026-09-18T08:00:00", endISO: "2026-09-18T18:00:00", netHours: 10.00, pay: 93.60 },
    { date: "2026-09-21", startISO: "2026-09-21T09:00:00", endISO: "2026-09-21T18:30:00", netHours: 9.50, pay: 88.20 },
    { date: "2026-09-22", startISO: "2026-09-22T09:00:00", endISO: "2026-09-22T23:30:00", netHours: 14.50, pay: 142.20 },
    { date: "2026-09-23", startISO: "2026-09-23T09:30:00", endISO: "2026-09-24T00:30:00", netHours: 15.00, pay: 147.60 },
    { date: "2026-09-24", startISO: "2026-09-24T09:00:00", endISO: "2026-09-25T00:00:00", netHours: 15.00, pay: 147.60 },
    { date: "2026-09-25", startISO: "2026-09-25T10:00:00", endISO: "2026-09-25T23:45:00", netHours: 13.75, pay: 134.10 }
  ];

  let stored = localStorage.getItem('extrahours_db_v2');
  let entries = (stored && JSON.parse(stored).length > 0) ? JSON.parse(stored) : [...excelDefaultData];

  function openForm() {
    document.getElementById('formCard').style.display = 'block';
  }

  function closeForm() {
    document.getElementById('formCard').style.display = 'none';
  }

  function saveAndRender() {
    entries.sort((a, b) => new Date(a.startISO) - new Date(b.startISO));
    localStorage.setItem('extrahours_db_v2', JSON.stringify(entries));
    
    const tbody = document.getElementById('logsTable');
    tbody.innerHTML = '';
    let sumHours = 0, sumPay = 0;

    entries.forEach((item, index) => {
      sumHours += item.netHours;
      sumPay += item.pay;

      let restWarning = '';
      if (index > 0) {
        let prevEnd = new Date(entries[index - 1].endISO);
        let currStart = new Date(item.startISO);
        let restHours = (currStart - prevEnd) / (1000 * 60 * 60);
        
        if (restHours < 11 && restHours >= 0) {
          restWarning = `<br><span class="warn-badge">⚠️ ${restHours.toFixed(1)}h ανάπαυση (&lt;11h)</span>`;
        }
      }

      tbody.innerHTML += `
        <tr>
          <td>${item.date}${restWarning}</td>
          <td>${item.netHours.toFixed(2)}h</td>
          <td>€${item.pay.toFixed(2)}</td>
          <td><button class="btn-del" onclick="deleteEntry(${index})">X</button></td>
        </tr>`;
    });

    document.getElementById('totalHours').innerText = sumHours.toFixed(2) + ' hrs';
    document.getElementById('totalPay').innerText = '€' + sumPay.toFixed(2);
  }

  function addEntry() {
    const date = document.getElementById('workDate').value;
    const start = document.getElementById('startTime').value;
    const end = document.getElementById('endTime').value;
    const breakMins = parseInt(document.getElementById('breakMins').value);

    if(!date || !start || !end) return alert('Συμπλήρωσε όλα τα πεδία');

    let startISO = new Date(`${date}T${start}`).toISOString();

    let exists = entries.some(e => e.startISO === startISO);
    if (exists) {
      return alert('Η συγκεκριμένη βάρδια έχει καταχωρηθεί ήδη!');
    }

    let [sH, sM] = start.split(':').map(Number);
    let [eH, eM] = end.split(':').map(Number);

    let d1 = new Date(2000, 0, 1, sH, sM);
    let d2 = new Date(2000, 0, 1, eH, eM);
    if (d2 <= d1) d2.setDate(d2.getDate() + 1);

    let endISO = new Date(new Date(startISO).getTime() + (d2 - d1)).toISOString();

    let diffMins = (d2 - d1) / (1000 * 60) - breakMins;
    if (diffMins < 0) diffMins = 0;

    let netHours = diffMins / 60;
    let baseRate = 9.0;
    let pay = netHours > 8 ? (8 * baseRate) + ((netHours - 8) * (baseRate * 1.2)) : netHours * baseRate;

    entries.push({ date, startISO, endISO, netHours, pay });
    saveAndRender();
    closeForm();
  }

  function deleteEntry(index) {
    entries.splice(index, 1);
    saveAndRender();
  }

  function resetExcelData() {
    entries = [...excelDefaultData];
    saveAndRender();
  }

  function exportCSV() {
    if(entries.length === 0) return alert('Δεν υπάρχουν δεδομένα!');
    let csv = 'Ημερομηνία,Ώρες,Αμοιβή (€)\n';
    entries.forEach(e => { csv += `${e.date},${e.netHours.toFixed(2)},${e.pay.toFixed(2)}\n`; });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `ExtraHours_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  function sendHR() {
    if(entries.length === 0) return alert('Δεν υπάρχουν δεδομένα!');
    let totalH = entries.reduce((a,b) => a + b.netHours, 0).toFixed(2);
    let totalP = entries.reduce((a,b) => a + b.pay, 0).toFixed(2);
    let body = `Καλησπέρα,\n\nΣας αποστέλλω τις ώρες εργασίας μου:\nΣύνολο Ωρών: ${totalH}\nΣύνολο Αμοιβής: €${totalP}\n\nΕυχαριστώ.`;
    window.location.href = `mailto:hr@company.com?subject=Ώρες Εργασίας&body=${encodeURIComponent(body)}`;
  }

  saveAndRender();
</script>
</body>
</html>
