<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrahoursmrk</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:#121212; color:#fff; padding:12px; margin:0; }
    h1 { color:#00e676; text-align:center; font-size:1.6rem; margin:12px 0; }
    .card { background:#1e1e1e; padding:16px; border-radius:12px; margin-bottom:14px; border:1px solid #333; }
    label { display:block; margin:10px 0 4px; color:#b0b0b0; font-size:0.9rem; }
    input, button { width:100%; padding:12px; margin-bottom:8px; border-radius:8px; border:1px solid #444; background:#2a2a2a; color:#fff; font-size:1rem; box-sizing:border-box; }
    button.btn-open { background:#00e676; color:#000; font-weight:bold; font-size:1.2rem; padding:16px; border:none; }
    button.btn-save { background:#00e676; color:#000; font-weight:bold; border:none; }
    button.btn-delete { background:#d32f2f; color:#fff; font-weight:bold; border:none; display:none; }
    button.btn-cancel { background:#444; color:#fff; border:none; }
    button.btn-sec { background:#2c2c2c; color:#fff; border:1px solid #555; }
    button.btn-sheets { background:#107c41; color:#fff; border:none; }
    button.btn-backup { background:#1976d2; color:#fff; border:none; }
    button.btn-restore { background:#f57c00; color:#fff; border:none; }
    button.btn-auto { background:#6a1b9a; color:#fff; border:none; }
    button.btn-year { background:#00695c; color:#fff; border:none; }
    button.btn-rates { background:#ef6c00; color:#fff; border:none; }
    button.btn-toggle-settings { background:#333; color:#ccc; border:1px solid #555; }
    .val-box { background:#252525; padding:12px; border-radius:8px; text-align:center; margin-bottom:10px; border:1px solid #383838; }
    .val { font-size:1.6rem; font-weight:bold; color:#00e676; margin-top:4px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; font-size:0.85rem; }
    th, td { padding:12px 8px; border-bottom:1px solid #333; text-align:left; }
    th { color:#aaa; }
    tr.clickable-row { cursor:pointer; }
    .badge-red { color:#ff5252; font-weight:bold; }
    #formCard, #settingsCard { display:none; }
  </style>
</head>
<body>
  <h1>Extrahoursmrk</h1>
  <button class="btn-open" onclick="openForm()">➕ Νέα Καταχώρηση Βάρδιας</button>
  <button class="btn-toggle-settings" onclick="toggleSettings()">⚙️ Ρυθμίσεις & Ασφάλεια Δεδομένων (Backup)</button>
  <div class="card" id="settingsCard" style="border-color:#1976d2;">
    <h3 style="margin-top:0;color:#1976d2;">Διαχείριση Backup & Επαναφοράς</h3>
    <button class="btn-backup" onclick="exportBackupJSON()">📤 Εξαγωγή Backup</button>
    <button class="btn-restore" onclick="triggerRestoreJSON()">📥 Εισαγωγή Backup</button>
    <button class="btn-auto" onclick="restoreAutoBackup()">↩️ Επαναφορά Αυτόματου Backup</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackupJSON(event)">
    <hr style="border-color:#444;margin:16px 0;">
    <h3 style="color:#ef6c00;">Τιμές Χρέωσης</h3>
    <label>Τιμή Υπερωρίας Καθημερινής (€ / ώρα)</label>
    <input type="number" step="0.01" id="rateWeekday" value="9">
    <label>Τιμή Σαββατοκύριακου (€ / ώρα)</label>
    <input type="number" step="0.01" id="rateWeekend" value="18">
    <button class="btn-rates" onclick="saveRates()">💾 Αποθήκευση Τιμών</button>
  </div>
  <div class="card" id="formCard">
    <h3 id="formTitle" style="margin-top:0;color:#00e676;">Καταχώρηση Βάρδιας</h3>
    <input type="hidden" id="editIndex" value="-1">
    <label>Ημερομηνία</label>
    <input type="date" id="workDate" onchange="livePreview()">
    <label>Ώρα Έναρξης</label>
    <input type="time" id="startTime" value="10:00" onchange="livePreview()">
    <label>Ώρα Λήξης</label>
    <input type="time" id="endTime" value="18:00" onchange="livePreview()">
    <label>Συνολικές Ώρες Βάρδιας</label>
    <input type="number" step="0.25" id="totalShiftHours" value="8.00" readonly>
    <label>Συνολικό Ποσό (€)</label>
    <input type="number" step="0.01" id="finalAmount" value="0.00" readonly>
    <button class="btn-save" onclick="saveEntry()">💾 Αποθήκευση</button>
    <button class="btn-delete" id="deleteBtn" onclick="deleteCurrentEntry()">🗑️ Διαγραφή Βάρδιας</button>
    <button class="btn-cancel" onclick="closeForm()">Ακύρωση</button>
  </div>
  <div class="card">
    <div class="val-box"><label>Σύνολο Ωρών Μήνα</label><div class="val" id="totalHoursVal">0.00 hrs</div></div>
    <div class="val-box"><label>Συνολικό Ποσό Μήνα</label><div class="val" id="totalPayVal">€0.00</div></div>
  </div>
  <div class="card">
    <label>Μήνας Αναφοράς</label>
    <input type="month" id="exportMonth" value="2026-10" onchange="saveAndRender()">
    <button class="btn-sec" onclick="exportExcelFile()">📊 Εξαγωγή σε Αρχείο Excel (.xlsx)</button>
    <button class="btn-year" onclick="exportFullYearExcel()">📊 Εξαγωγή Όλου του Έτους</button>
    <button class="btn-sheets" onclick="syncGoogleSheets()">🟢 Οδηγίες για Google Sheets</button>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Ιστορικό Βαρδιών</h3>
    <table><thead><tr><th>Ημερομηνία</th><th>Ώρες</th><th>Συνολικό Ποσό</th></tr></thead><tbody id="logsTable"></tbody></table>
  </div>
<script>
  let rates = JSON.parse(localStorage.getItem('extrahours_rates') || '{"weekday":9,"weekend":18}');
  let stored = localStorage.getItem('extrahours_exact_data_v23');
  let shifts = stored ? JSON.parse(stored) : [];
  function getDayName(dateStr) {
    let days = ["Κυριακή","Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή","Σάββατο"];
    return days[new Date(dateStr).getDay()];
  }
  function isWeekend(dateStr) { let d = new Date(dateStr).getDay(); return d === 0 || d === 6; }
  function timeToMinutes(timeStr) { let [h,m] = timeStr.split(':').map(Number); return h*60+m; }
  function calculateShiftHours(start, end) {
    let s = timeToMinutes(start), e = timeToMinutes(end);
    if (e < s) e += 1440;
    return (e - s) / 60;
  }
  function endAbsolute(item) {
    let end = timeToMinutes(item.end);
    if (timeToMinutes(item.end) < timeToMinutes(item.start)) end += 1440;
    return end;
  }
  function isLaterShiftSameDay(item, all) {
    return all.some(s => s !== item && s.date === item.date && timeToMinutes(s.start) < timeToMinutes(item.start));
  }
  function calcOne(item, allSorted) {
    let hours = calculateShiftHours(item.start, item.end);
    let weekend = isWeekend(item.date);
    let later = isLaterShiftSameDay(item, allSorted);
    let overtimeHours = later ? hours : Math.max(0, hours - 8);
    let baseAmount = weekend ? hours * rates.weekend : (later ? hours * rates.weekday : overtimeHours * rates.weekday);
    let extraRestPay = 0, restHoursDeficit = 0;
    let idx = allSorted.indexOf(item);
    let prevDay = null;
    for (let i = 0; i < idx; i++) {
      if (allSorted[i].date !== item.date) prevDay = allSorted[i].date;
    }
    if (prevDay) {
      let prevDate = new Date(prevDay), currDate = new Date(item.date);
      let diffDays = Math.round((currDate - prevDate) / 86400000);
      let firstOfDay = allSorted.filter(s => s.date === item.date).sort((a,b) => timeToMinutes(a.start)-timeToMinutes(b.start))[0];
      if (diffDays === 1 && item === firstOfDay) {
        let prevShifts = allSorted.filter(s => s.date === prevDay);
        let latest = prevShifts.reduce((a,b) => endAbsolute(a) > endAbsolute(b) ? a : b);
        let prevEnd = endAbsolute(latest);
        let currStart = timeToMinutes(item.start) + 1440;
        let restHours = (currStart - prevEnd) / 60;
        if (restHours < 11) {
          restHoursDeficit = 11 - restHours;
          extraRestPay = restHoursDeficit * rates.weekday;
        }
      }
    }
    return {
      ...item,
      dayName: getDayName(item.date),
      hours, overtimeHours, extraRestPay, restHoursDeficit,
      finalAmt: baseAmount + extraRestPay,
      isWeekend: weekend,
      laterShift: later
    };
  }
  function processAllShifts(arr) {
    let sorted = [...arr].sort((a,b) => a.date === b.date ? timeToMinutes(a.start)-timeToMinutes(b.start) : new Date(a.date)-new Date(b.date));
    return sorted.map(item => calcOne(item, sorted));
  }
  function livePreview() {
    let dateStr = document.getElementById('workDate').value;
    let start = document.getElementById('startTime').value;
    let end = document.getElementById('endTime').value;
    let hours = calculateShiftHours(start, end);
    let later = shifts.some(s => s.date === dateStr && s.start !== start);
    let weekend = isWeekend(dateStr);
    let amt = weekend ? hours * rates.weekend : (later ? hours * rates.weekday : Math.max(0, hours-8) * rates.weekday);
    document.getElementById('totalShiftHours').value = hours.toFixed(2);
    document.getElementById('finalAmount').value = amt.toFixed(2);
  }
  function toggleSettings() {
    const card = document.getElementById('settingsCard');
    card.style.display = card.style.display === 'block' ? 'none' : 'block';
    document.getElementById('rateWeekday').value = rates.weekday;
    document.getElementById('rateWeekend').value = rates.weekend;
  }
  function saveRates() {
    rates.weekday = parseFloat(document.getElementById('rateWeekday').value) || 9;
    rates.weekend = parseFloat(document.getElementById('rateWeekend').value) || 18;
    localStorage.setItem('extrahours_rates', JSON.stringify(rates));
    alert('Οι τιμές αποθηκεύτηκαν. Ισχύουν στις νέες καταχωρήσεις.');
    saveAndRender();
  }
  function openForm(index) {
    if (index === undefined) index = -1;
    document.getElementById('editIndex').value = index;
    const deleteBtn = document.getElementById('deleteBtn');
    let processed = processAllShifts(shifts);
    if (index === -1) {
      document.getElementById('formTitle').innerText = 'Νέα Καταχώρηση Βάρδιας';
      document.getElementById('workDate').value = new Date().toISOString().substring(0,10);
      document.getElementById('startTime').value = '10:00';
      document.getElementById('endTime').value = '18:00';
      deleteBtn.style.display = 'none';
    } else {
      document.getElementById('formTitle').innerText = 'Επεξεργασία Βάρδιας';
      let item = processed[index];
      document.getElementById('workDate').value = item.date;
      document.getElementById('startTime').value = item.start;
      document.getElementById('endTime').value = item.end;
      deleteBtn.style.display = 'block';
    }
    livePreview();
    document.getElementById('formCard').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function closeForm() { document.getElementById('formCard').style.display = 'none'; }
  function saveAndRender() {
    let processed = processAllShifts(shifts);
    let monthVal = document.getElementById('exportMonth').value;
    let displayList = processed.filter(item => item.date.startsWith(monthVal)).sort((a,b) => b.date.localeCompare(a.date) || timeToMinutes(b.start)-timeToMinutes(a.start));
    localStorage.setItem('extrahours_exact_data_v23', JSON.stringify(shifts));
    localStorage.setItem('extrahours_auto_backup', JSON.stringify({timestamp: new Date().toISOString(), data: shifts}));
    const tbody = document.getElementById('logsTable');
    tbody.innerHTML = '';
    let totalHoursSum = 0, totalPaySum = 0;
    displayList.forEach(item => {
      totalHoursSum += Number(item.hours);
      totalPaySum += Number(item.finalAmt);
      let weekendLabel = item.isWeekend ? ' <span style="color:#ffeb3b;font-size:0.75rem;">(' + item.dayName + ' ' + rates.weekend + '€)</span>' : ' <span style="color:#aaa;font-size:0.75rem;">(' + item.dayName + ')</span>';
      let extraTag = item.extraRestPay > 0 ? ' <span class="badge-red">⚠️ +' + item.restHoursDeficit.toFixed(1) + 'h extra (€' + item.extraRestPay.toFixed(2) + ')</span>' : '';
      let laterTag = item.laterShift ? ' <span style="color:#80cbc4;font-size:0.75rem;">2η βάρδια</span>' : '';
      let origIndex = shifts.findIndex(s => s.date === item.date && s.start === item.start && s.end === item.end);
      tbody.innerHTML += '<tr class="clickable-row" onclick="openForm(' + origIndex + ')">' +
        '<td><b>' + item.date + '</b>' + weekendLabel + laterTag + extraTag + '<br><span style="color:#aaa;font-size:0.8rem;">🕒 ' + item.start + ' - ' + item.end + '</span></td>' +
        '<td>Ώρες: <b>' + Number(item.hours).toFixed(2) + 'h</b></td>' +
        '<td><b>€' + Number(item.finalAmt).toFixed(2) + '</b></td></tr>';
    });
    totalPaySum = Math.floor(totalPaySum / 5) * 5;
    document.getElementById('totalHoursVal').innerText = totalHoursSum.toFixed(2) + ' hrs';
    document.getElementById('totalPayVal').innerText = '€' + totalPaySum.toFixed(2);
  }
  function saveEntry() {
    const editIndex = parseInt(document.getElementById('editIndex').value);
    let dateStr = document.getElementById('workDate').value;
    let start = document.getElementById('startTime').value;
    let end = document.getElementById('endTime').value;
    if (!dateStr) return alert('Συμπλήρωσε ημερομηνία!');
    const entry = { date: dateStr, start: start, end: end };
    if (editIndex === -1) shifts.push(entry);
    else {
      let processed = processAllShifts(shifts);
      let target = processed[editIndex];
      let realIdx = shifts.findIndex(s => s.date === target.date && s.start === target.start && s.end === target.end);
      if (realIdx !== -1) shifts[realIdx] = entry; else shifts.push(entry);
    }
    saveAndRender();
    closeForm();
  }
  function deleteCurrentEntry() {
    const editIndex = parseInt(document.getElementById('editIndex').value);
    if (editIndex >= 0 && confirm('Σίγουρα θέλεις να διαγράψεις αυτή τη βάρδια?')) {
      let processed = processAllShifts(shifts);
      let target = processed[editIndex];
      let realIdx = shifts.findIndex(s => s.date === target.date && s.start === target.start && s.end === target.end);
      if (realIdx !== -1) shifts.splice(realIdx, 1);
      saveAndRender();
      closeForm();
    }
  }
  function restoreAutoBackup() {
    let auto = localStorage.getItem('extrahours_auto_backup');
    if (!auto) return alert('Δεν υπάρχει αυτόματο backup.');
    if (confirm('Επαναφορά τελευταίου αυτόματου backup;')) {
      shifts = JSON.parse(auto).data;
      saveAndRender();
    }
  }
  function monthNames() {
    return {"01":"Ιανουάριος","02":"Φεβρουάριος","03":"Μάρτιος","04":"Απρίλιος","05":"Μάιος","06":"Ιούνιος","07":"Ιούλιος","08":"Αύγουστος","09":"Σεπτέμβριος","10":"Οκτώβριος","11":"Νοέμβριος","12":"Δεκέμβριος"};
  }
  function styleHeader(row) {
    row.font = { bold:true, color:{argb:'FFFFFFFF'} };
    row.eachCell(cell => { cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF263238'} }; });
  }
  async function exportExcelFile() {
    let processed = processAllShifts(shifts).filter(item => item.date.startsWith(document.getElementById('exportMonth').value));
    if (!processed.length) return alert('Δεν υπάρχουν δεδομένα!');
    let monthVal = document.getElementById('exportMonth').value;
    let [year, mNum] = monthVal.split('-');
    let names = monthNames();
    const workbook = new ExcelJS.Workbook();
    const worksheet = workbook.addWorksheet('Βάρδιες');
    worksheet.addRow(['ΜΗΝΑΣ ΑΝΑΦΟΡΑΣ: ' + (names[mNum]||mNum) + ' ' + year]);
    worksheet.addRow();
    styleHeader(worksheet.addRow(['Ημερομηνία & Ημέρα','Έναρξη','Λήξη','Συνολικές Ώρες','Ώρες Υπερωρίας','Ώρες Ανάπαυσης (<11h)','Ποσό Ανάπαυσης (€)','Συνολικό Ποσό']));
    let sums = [0,0,0,0,0];
    processed.forEach(item => {
      sums[0]+=item.hours; sums[1]+=item.overtimeHours; sums[2]+=item.restHoursDeficit; sums[3]+=item.extraRestPay; sums[4]+=item.finalAmt;
      let row = worksheet.addRow([item.date+' ('+item.dayName+')', item.start, item.end, +item.hours.toFixed(2), +item.overtimeHours.toFixed(2), +item.restHoursDeficit.toFixed(2), +item.extraRestPay.toFixed(2), +item.finalAmt.toFixed(2)]);
      if (item.isWeekend) row.eachCell(cell => { cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFFEBEE'}}; });
    });
    worksheet.addRow();
    worksheet.addRow(['ΣΥΝΟΛΑ:','','', +sums[0].toFixed(2), +sums[1].toFixed(2), +sums[2].toFixed(2), +sums[3].toFixed(2), Math.floor(sums[4]/5)*5]);
    worksheet.columns = [{width:26},{width:12},{width:12},{width:16},{width:16},{width:22},{width:20},{width:18}];
    const buffer = await workbook.xlsx.writeBuffer();
    saveAs(new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'ExtraHours_'+(names[mNum]||mNum)+'_'+year+'.xlsx');
  }
  async function exportFullYearExcel() {
    let processed = processAllShifts(shifts);
    if (!processed.length) return alert('Δεν υπάρχουν δεδομένα!');
    let names = monthNames();
    let byMonth = {};
    processed.forEach(item => { let m = item.date.substring(0,7); (byMonth[m] ||= []).push(item); });
    const workbook = new ExcelJS.Workbook();
    const worksheet = workbook.addWorksheet('Όλο το Έτος');
    worksheet.addRow(['ΕΞΑΓΩΓΗ ΟΛΟΥ ΤΟΥ ΕΤΟΥΣ']);
    worksheet.addRow();
    let grand = [0,0,0,0,0];
    Object.keys(byMonth).sort().forEach(monthKey => {
      let [year, mNum] = monthKey.split('-');
      worksheet.addRow(['ΜΗΝΑΣ: ' + (names[mNum]||mNum) + ' ' + year]);
      styleHeader(worksheet.addRow(['Ημερομηνία & Ημέρα','Έναρξη','Λήξη','Συνολικές Ώρες','Ώρες Υπερωρίας','Ώρες Ανάπαυσης (<11h)','Ποσό Ανάπαυσης (€)','Συνολικό Ποσό']));
      let s = [0,0,0,0,0];
      byMonth[monthKey].forEach(item => {
        s[0]+=item.hours; s[1]+=item.overtimeHours; s[2]+=item.restHoursDeficit; s[3]+=item.extraRestPay; s[4]+=item.finalAmt;
        worksheet.addRow([item.date+' ('+item.dayName+')', item.start, item.end, +item.hours.toFixed(2), +item.overtimeHours.toFixed(2), +item.restHoursDeficit.toFixed(2), +item.extraRestPay.toFixed(2), +item.finalAmt.toFixed(2)]);
      });
      worksheet.addRow(['ΣΥΝΟΛΑ ΜΗΝΑ:','','', +s[0].toFixed(2), +s[1].toFixed(2), +s[2].toFixed(2), +s[3].toFixed(2), Math.floor(s[4]/5)*5]);
      worksheet.addRow();
      for (let i=0;i<5;i++) grand[i]+=s[i];
    });
    worksheet.addRow(['ΓΕΝΙΚΟ ΣΥΝΟΛΟ:','','', +grand[0].toFixed(2), +grand[1].toFixed(2), +grand[2].toFixed(2), +grand[3].toFixed(2), Math.floor(grand[4]/5)*5]);
    worksheet.columns = [{width:26},{width:12},{width:12},{width:16},{width:16},{width:22},{width:20},{width:18}];
    const buffer = await workbook.xlsx.writeBuffer();
    saveAs(new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'ExtraHours_Ολο_το_Ετος.xlsx');
  }
  function syncGoogleSheets() { alert('Κάνε εξαγωγή Excel και ανέβασέ το στο Google Drive: Αρχείο → Εισαγωγή.'); }
  function exportBackupJSON() {
    const a = document.createElement('a');
    a.href = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(shifts, null, 2));
    a.download = 'extrahours_backup.json';
    a.click();
  }
  function triggerRestoreJSON() { document.getElementById('importFile').click(); }
  function importBackupJSON(event) {
    const reader = new FileReader();
    if (!event.target.files[0]) return;
    reader.onload = function(e) {
      try {
        let parsed = JSON.parse(e.target.result);
        if (Array.isArray(parsed)) { shifts = parsed; saveAndRender(); alert('Το backup επαναφέρθηκε.'); }
        else alert('Το αρχείο δεν είναι έγκυρο.');
      } catch (err) { alert('Σφάλμα ανάγνωσης.'); }
    };
    reader.readAsText(event.target.files[0], 'UTF-8');
  }
  document.getElementById('rateWeekday').value = rates.weekday;
  document.getElementById('rateWeekend').value = rates.weekend;
  saveAndRender();
</script>
</body>
</html>
