<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extrahoursmrk</title>
  
  <!-- Χρησιμοποιούμε τη βιβλιοθήκη ExcelJS για σωστή μορφοποίηση στηλών και χρωμάτων -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 12px;
      margin: 0;
    }
    h1 { color: #00e676; text-align: center; font-size: 1.6rem; margin: 12px 0; }
    .card {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    label { display: block; margin: 10px 0 4px; color: #b0b0b0; font-size: 0.9rem; font-weight: 500; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button.btn-open {
      background: #00e676;
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;

    button.btn-cancel { background: #444; color: #fff; border: none; margin-top: 6px; }
    button.btn-sec { background: #2c2c2c; color: #fff; border: 1px solid #555; margin-top: 8px; font-weight: 600; }
    button.btn-sheets { background: #107c41; color: #fff; border: none; margin-top: 8px; font-weight: 600; }
    button.btn-backup { background: #1976d2; color: #fff; border: none; margin-top: 8px; font-weight: 600; }
    button.btn-restore { background: #f57c00; color: #fff; border: none; margin-top: 8px; font-weight: 600; }
    button.btn-toggle-settings { background: #333; color: #ccc; border: 1px solid #555; font-size: 0.9rem; padding: 10px; margin-bottom: 14px; }
    
    .val-box { background: #252525; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 10px; border: 1px solid #383838; }
    .val { font-size: 1.6rem; font-weight: bold; color: #00e676; margin-top: 4px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { padding: 12px 8px; border-bottom: 1px solid #333; text-align: left; }
    th { color: #aaa; font-weight: 600; }
    
    tr.clickable-row {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    tr.clickable-row:active, tr.clickable-row:hover {
      background-color: #2c2c2c;
    }
    .badge-red { color: #ff5252; font-weight: bold; }
    #formCard, #settingsCard { display: none; }

</head>
<body>

  <h1>Extrahoursmrk</h1>

  <button class="btn-open" onclick="openForm()">➕ Νέα Καταχώρηση Βάρδιας</button>

  <button class="btn-toggle-settings" onclick="toggleSettings()">⚙️ Ρυθμίσεις & Ασφάλεια Δεδομένων (Backup)</button>

  <div class="card" id="settingsCard" style="border-color: #1976d2;">
    <h3 style="margin-top:0; color:#1976d2; font-size: 1.1rem;">Διαχείριση Backup & Επαναφοράς</h3>
    <button class="btn-backup" onclick="exportBackupJSON()">📤 Εξαγωγή Backup</button>
    <button class="btn-restore" onclick="triggerRestoreJSON()">📥 Εισαγωγή Backup</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackupJSON(event)">
  </div>

  <div class="card" id="formCard">
    <h3 id="formTitle" style="margin-top:0; color:#00e676;">Καταχώρηση Βάρδιας</h3>
    
    <input type="hidden" id="editIndex" value="-1">

    <label>Ημερομηνία</label>
    <input type="date" id="workDate" onchange="livePreview()">

    <label>Ώρα Έναρξης</label>
    <input type="time" id="startTime" value="10:00" onchange="livePreview()">

    <label>Ώρα Λήξης</label>
    <input type="time" id="endTime" value="18:00" onchange="livePreview()">

    <label>Συνολικές Ώρες Βάρδιας</label>
    <input type="number" step="0.25" id="totalShiftHours" value="8.00" readonly>

    <label>Συνολικό Ποσό (€)</label>
    <input type="number" step="0.01" id="finalAmount" value="0.00" readonly>

    <button class="btn-save" onclick="saveEntry()">💾 Αποθήκευση</button>
    <button class="btn-delete" id="deleteBtn" onclick="deleteCurrentEntry()">🗑️ Διαγραφή Βάρδιας</button>
    <button class="btn-cancel" onclick="closeForm()">Ακύρωση</button>
  </div>

  <div class="card">
    <div class="val-box">
      <label>Σύνολο Ωρών Μήνα</label>
      <div class="val" id="totalHoursVal">0.00 hrs</div>
    </div>
    <div class="val-box">
      <label>Συνολικό Ποσό Μήνα</label>
      <div class="val" id="totalPayVal">€0.00</div>
    </div>
  </div>

  <div class="card">
    <label>Μήνας Αναφοράς</label>
    <input type="month" id="exportMonth" value="2026-09">

    <button class="btn-sec" onclick="exportExcelFile()">📊 Εξαγωγή σε Αρχείο Excel (.xlsx)</button>
    <button class="btn-sheets" onclick="syncGoogleSheets()">🟢 Οδηγίες για Google Sheets</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Ιστορικό Βαρδιών</h3>
    <table>
      <thead>
        <tr>
          <th>Ημερομηνία</th>
          <th>Ώρες</th>
          <th>Συνολικό Ποσό</th>
        </tr>
      </thead>
      <tbody id="logsTable"></tbody>
    </table>
  </div>

<script>

    {date: "2026-09-15", start: "10:00", end: "18:00"},
    {date: "2026-09-16", start: "09:00", end: "18:30"},
    {date: "2026-09-17", start: "09:00", end: "01:00"},
    {date: "2026-09-18", start: "08:00", end: "18:00"},

    {date: "2026-09-25", start: "10:00", end: "23:45"},
    {date: "2026-09-26", start: "10:00", end: "00:30"}
  ];

  let stored = localStorage.getItem('extrahours_exact_data_v23');
  let shifts = stored ? JSON.parse(stored) : defaultShifts;
  if (!stored) {
    localStorage.setItem('extrahours_exact_data_v23', JSON.stringify(shifts));
  }

  function getDayName(dateStr) {
    let days = ["Κυριακή", "Δευτέρα", "Τρίτη", "Τετάρτη", "Πέμπτη", "Παρασκευή", "Σάββατο"];
    let d = new Date(dateStr);
    return days[d.getDay()];
  }

  function isWeekend(dateStr) {
    let d = new Date(dateStr);
    let day = d.getDay();
    return (day === 0 || day === 6);
  }

  function timeToMinutes(timeStr) {
    let [h, m] = timeStr.split(':').map(Number);
    return h * 60 + m;
  }

  function calculateShiftHours(start, end) {
    let sMin = timeToMinutes(start);
    let eMin = timeToMinutes(end);
    if (eMin < sMin) eMin += 24 * 60;
    return (eMin - sMin) / 60;
  }

  function processAllShifts(arr) {
    let sorted = [...arr].sort((a, b) => new Date(a.date) - new Date(b.date));
    
    let results = sorted.map((item, idx) => {
      let hours = calculateShiftHours(item.start, item.end);
      let weekend = isWeekend(item.date);
      let dayName = getDayName(item.date);
      
      let baseAmount = 0;
      let overtimeHours = Math.max(0, hours - 8);

      if (weekend) {
        baseAmount = hours * 18.0;
      } else {
        baseAmount = overtimeHours * 9.0;
      }

      let extraRestPay = 0;
      let restHoursDeficit = 0;

      if (idx > 0) {
        let prev = sorted[idx - 1];
        let prevDateObj = new Date(prev.date);
        let currDateObj = new Date(item.date);
        let diffDays = Math.round((currDateObj - prevDateObj) / (1000 * 60 * 60 * 24));

        if (diffDays === 1) {
          let prevEndMin = timeToMinutes(prev.end);
          let prevEndTimeAbsolute = prevEndMin;
          if (timeToMinutes(prev.end) < timeToMinutes(prev.start)) {
            prevEndTimeAbsolute += 24 * 60;
          }
          
          let currStartAbsolute = timeToMinutes(item.start) + 24 * 60;
          let restHours = (currStartAbsolute - prevEndTimeAbsolute) / 60;

          if (restHours < 11) {
            restHoursDeficit = 11 - restHours;
            let restRate = 9.0;
            extraRestPay = restHoursDeficit * restRate; 
          }
        }
      }
